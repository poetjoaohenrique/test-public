
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Local</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 5%;
    font-family: Arial, sans-serif;
    color: #222;
    background: #fff;
}

h2 {
    margin: 0 0 5%;
    font-size: 1.4rem;
}

.categorias {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 0 4%;
    margin-bottom: 3%;
}

.categoria {
    flex-shrink: 0;
    border: 1px solid #ddd;
    border-radius: 30px;
    background: white;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 0.95rem;
}

.categoria.ativa {
    background: #ffd400;
    border-color: #ffd400;
    font-weight: bold;
}

.produtos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 12px;
    min-width: 0;
}

.emoji {
    background: #f6f6f6;
    border-radius: 8px;
    padding: 20% 0;
    text-align: center;
    font-size: 2.5rem;
}

.card h3 {
    font-size: 1rem;
    margin-bottom: 5px;
}

.card p {
    color: #777;
    font-size: 0.85rem;
}

.preco {
    font-weight: bold;
    color: #16803c;
}

@media (min-width: 700px) {
    .produtos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<h2>Todos os Produtos</h2>

<div class="categorias" id="categorias">
    <button class="categoria ativa" data-categoria="Todos">🔥 Todos</button>
    <button class="categoria" data-categoria="Hambúrgueres">🍔 Hambúrgueres</button>
    <button class="categoria" data-categoria="Pizzas">🍕 Pizzas</button>
    <button class="categoria" data-categoria="Porções">🍟 Porções</button>
    <button class="categoria" data-categoria="Bebidas">🥤 Bebidas</button>
</div>

<div class="produtos" id="produtos"></div>

<script>
const listaProdutos = [
    { nome: "X-Burger", categoria: "Hambúrgueres", preco: 18, emoji: "🍔", vendas: 30 },
    { nome: "X-Bacon", categoria: "Hambúrgueres", preco: 23, emoji: "🍔", vendas: 20 },
    { nome: "Pizza Calabresa", categoria: "Pizzas", preco: 39, emoji: "🍕", vendas: 50 },
    { nome: "Pizza Queijo", categoria: "Pizzas", preco: 35, emoji: "🍕", vendas: 25 },
    { nome: "Batata Frita", categoria: "Porções", preco: 15, emoji: "🍟", vendas: 40 },
    { nome: "Refrigerante", categoria: "Bebidas", preco: 7, emoji: "🥤", vendas: 60 },
    { nome: "Suco Natural", categoria: "Bebidas", preco: 9, emoji: "🧃", vendas: 15 }
];

const areaProdutos = document.getElementById("produtos");
const botoes = document.querySelectorAll(".categoria");

function mostrarProdutos(categoria) {
    const filtrados = listaProdutos
        .filter(p => categoria === "Todos" || p.categoria === categoria)
        .sort((a, b) => b.vendas - a.vendas);

    areaProdutos.innerHTML = filtrados.map(p => `
        <article class="card">
            <div class="emoji">${p.emoji}</div>
            <h3>${p.nome}</h3>
            <p>${p.categoria}</p>
            <div class="preco">
                R$ ${p.preco.toFixed(2).replace(".", ",")}
            </div>
        </article>
    `).join("");
}

botoes.forEach(botao => {
    botao.addEventListener("click", () => {
        botoes.forEach(b => b.classList.remove("ativa"));
        botao.classList.add("ativa");

        // Atualiza somente os produtos.
        // A página e a posição do scroll permanecem.
        mostrarProdutos(botao.dataset.categoria);
    });
});

mostrarProdutos("Todos");
</script>

</body>
</html>
